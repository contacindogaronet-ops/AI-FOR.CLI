name: Build KUL Engine

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Compile Optimized ARM64 Binary
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go mod tidy
          mkdir -p dist
          # Strip debugging info (-s -w) agar biner ringan & eksekusi cepat
          go build -trimpath -ldflags="-s -w" -o dist/kul-engine-arm64 .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kul-engine-arm64
          path: dist/kul-engine-arm64
